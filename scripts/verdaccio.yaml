# Local dev registry for the v2 `next` lane (docs/verdaccio.md).
# Start:   pnpm registry:local        (or: npx verdaccio --config scripts/verdaccio.yaml)
# Publish: pnpm publish-dev
# Consume: @agentick:registry=http://localhost:4873  (in the consumer repo's .npmrc)
storage: ../.verdaccio/storage
web:
  title: agentick local registry
uplinks:
  npmjs:
    url: https://registry.npmjs.org/
packages:
  "@agentick/*":
    # Local scope: anyone on localhost can publish/unpublish — dev registry only.
    access: $all
    publish: $all
    unpublish: $all
    # Fall through to npm for anything not published here (e.g. v1 0.15.x).
    proxy: npmjs
  "agentick":
    access: $all
    publish: $all
    unpublish: $all
    proxy: npmjs
  "**":
    access: $all
    proxy: npmjs
log:
  - { type: stdout, format: pretty, level: warn }
