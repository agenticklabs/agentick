  # Prerelease lane: v2 releases X.Y.Z-next.N from the same runs that ship v1
  # stable on the main lane. Lanes are per-package (pnpm has no group shorthand).
  lanes:
    "@agentick/app-next": next
    "@agentick/client-next": next
    "@agentick/client-core-next": next
    "@agentick/client-extensions-next": next
    "@agentick/client-react-next": next
