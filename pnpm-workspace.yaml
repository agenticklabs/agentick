packages:
  - packages/*
  - example/*
  - website

autoInstallPeers: true

# pnpm 11 replaced onlyBuiltDependencies / onlyBuiltDependenciesFile with allowBuilds
# (a package → boolean dependency-build allowlist). https://pnpm.io/settings
# Only esbuild + onnxruntime-node ran build scripts under pnpm 10 (the old
# onlyBuiltDependencies allowlist); the rest stay denied to preserve that baseline.
allowBuilds:
  esbuild: true
  onnxruntime-node: true
  "@nestjs/core": false
  isolated-vm: false
  msgpackr-extract: false
  msw: false
  protobufjs: false
  sharp: false
  simple-git-hooks: false

# ── Native versioning (pnpm >=11.13) — https://pnpm.io/versioning ─────────────
# Config is read from HERE, not .changeset/config.json (that file is inert now
# that @changesets/cli is removed). Intent files (.changeset/*.md, changesets
# format) + the ledger (.changeset/ledger.yaml) are still read from .changeset/.
versioning:
  # One fixed group: releases at one shared version.
  # (v1 versions/publishes from `master` only — it left the feat/v2 branch
  #  entirely, so this branch carries no v1 fixed group.)
  fixed:
    # v2 line (packages/*) — every publishable package; on the "next" lane.
    - - "@agentick/app"
      - "@agentick/client"
      - "@agentick/client-core"
      - "@agentick/client-extensions"
      - "@agentick/client-react"
      - "@agentick/cluster"
      - "@agentick/cluster-broker"
      - "@agentick/cluster-net"
      - "@agentick/cluster-redis"
      - "@agentick/cluster-ws"
      - "@agentick/code"
      - "@agentick/code-host"
      - "@agentick/code-secure-exec"
      - "@agentick/compiler"
      - "@agentick/compiler-react"
      - "@agentick/connector"
      - "@agentick/credentials"
      - "@agentick/elicitation"
      - "@agentick/eval"
      - "@agentick/formatters"
      - "@agentick/gates"
      - "@agentick/gateway"
      - "@agentick/knobs"
      - "@agentick/live"
      - "@agentick/loop-executor"
      - "@agentick/mcp"
      - "@agentick/model"
      - "@agentick/model-ai-sdk"
      - "@agentick/model-anthropic"
      - "@agentick/model-executor"
      - "@agentick/model-google"
      - "@agentick/model-openai"
      - "@agentick/prompts"
      - "@agentick/prompts-react"
      - "@agentick/pubsub"
      - "@agentick/resources"
      - "@agentick/runtime"
      - "@agentick/sandbox"
      - "@agentick/sandbox-docker"
      - "@agentick/sandbox-lambda"
      - "@agentick/sandbox-local"
      - "@agentick/session"
      - "@agentick/skills"
      - "@agentick/spec"
      - "@agentick/state"
      - "@agentick/store"
      - "@agentick/subscriptions"
      - "@agentick/tasks"
      - "@agentick/tasks-store-postgres"
      - "@agentick/telemetry-otlp"
      - "@agentick/timeline"
      - "@agentick/timeline-fs"
      - "@agentick/timeline-postgres"
      - "@agentick/tool"
      - "@agentick/tool-executor"
      - "@agentick/transport"
      - "@agentick/transport-http"
      - "@agentick/transport-in-process"
      - "@agentick/transport-unix-socket"
      - "@agentick/transport-websocket"
      - "@agentick/utils"
  # Prerelease lane: v2 releases X.Y.Z-next.N on the `next` npm tag.
  # Lanes are per-package (pnpm has no group shorthand).
  lanes:
    "@agentick/app": next
    "@agentick/client": next
    "@agentick/client-core": next
    "@agentick/client-extensions": next
    "@agentick/client-react": next
    "@agentick/cluster": next
    "@agentick/cluster-broker": next
    "@agentick/cluster-net": next
    "@agentick/cluster-redis": next
    "@agentick/cluster-ws": next
    "@agentick/code": next
    "@agentick/code-host": next
    "@agentick/code-secure-exec": next
    "@agentick/compiler": next
    "@agentick/compiler-react": next
    "@agentick/connector": next
    "@agentick/credentials": next
    "@agentick/elicitation": next
    "@agentick/eval": next
    "@agentick/formatters": next
    "@agentick/gates": next
    "@agentick/gateway": next
    "@agentick/knobs": next
    "@agentick/live": next
    "@agentick/loop-executor": next
    "@agentick/mcp": next
    "@agentick/model": next
    "@agentick/model-ai-sdk": next
    "@agentick/model-anthropic": next
    "@agentick/model-executor": next
    "@agentick/model-google": next
    "@agentick/model-openai": next
    "@agentick/prompts": next
    "@agentick/prompts-react": next
    "@agentick/pubsub": next
    "@agentick/resources": next
    "@agentick/runtime": next
    "@agentick/sandbox": next
    "@agentick/sandbox-docker": next
    "@agentick/sandbox-lambda": next
    "@agentick/sandbox-local": next
    "@agentick/session": next
    "@agentick/skills": next
    "@agentick/spec": next
    "@agentick/state": next
    "@agentick/store": next
    "@agentick/subscriptions": next
    "@agentick/tasks": next
    "@agentick/tasks-store-postgres": next
    "@agentick/telemetry-otlp": next
    "@agentick/timeline": next
    "@agentick/timeline-fs": next
    "@agentick/timeline-postgres": next
    "@agentick/tool": next
    "@agentick/tool-executor": next
    "@agentick/transport": next
    "@agentick/transport-http": next
    "@agentick/transport-in-process": next
    "@agentick/transport-unix-socket": next
    "@agentick/transport-websocket": next
    "@agentick/utils": next
  # Skip the example apps. They are private (never published), but pnpm native
  # versioning still bumps private packages unless they are ignored here, so the
  # v2 example apps are listed explicitly.
  ignore:
    - "example-v2-real"
    - "example-v2-coding-agent"
    - "example-v2-otto"
    - "example-v2-otto-cluster"
  # Committed CHANGELOG.md per package. NOT registry storage: registry-composed
  # changelogs fetch the PREVIOUS version's tarball at publish time — for the 8
  # names v1 also published (client, gateway, mcp, sandbox×3, connector, eval)
  # that "previous version" is v1 0.15.x through the registry proxy, a different
  # lineage the v2 changelog must not build on (and whose proxied tarball fetch
  # 500s through the CodeArtifact uplink).
  changelog:
    storage: repository
