packages:
  - packages/*
  - packages/adapters/*
  - packages-next/*
  - example/*
  - website

autoInstallPeers: true

# pnpm 11 replaced onlyBuiltDependencies / onlyBuiltDependenciesFile with allowBuilds
# (a package → boolean dependency-build allowlist). https://pnpm.io/settings
# Only esbuild + onnxruntime-node ran build scripts under pnpm 10 (the old
# onlyBuiltDependencies allowlist); the rest stay denied to preserve that baseline.
allowBuilds:
  esbuild: true
  onnxruntime-node: true
  '@nestjs/core': false
  isolated-vm: false
  msgpackr-extract: false
  msw: false
  protobufjs: false
  sharp: false
  simple-git-hooks: false

# ── Native versioning (pnpm >=11.13) — https://pnpm.io/versioning ─────────────
# Config is read from HERE, not .changeset/config.json (that file is inert now
# that @changesets/cli is removed). Intent files (.changeset/*.md, changesets
# format) + the ledger (.changeset/ledger.yaml) are still read from .changeset/.
versioning:
  # Two fixed groups: each releases at one shared version.
  fixed:
    # v1 line (packages/*) — stable, ships 0.15.x on the main lane.
    - - "./packages/agentick"
      - "@agentick/kernel"
      - "@agentick/shared"
      - "@agentick/core"
      - "@agentick/client"
      - "@agentick/react"
      - "@agentick/angular"
      - "@agentick/gateway"
      - "@agentick/server"
      - "@agentick/express"
      - "@agentick/nestjs"
      - "@agentick/tui"
      - "@agentick/sandbox"
      - "@agentick/sandbox-local"
      - "@agentick/sandbox-docker"
      - "@agentick/agent"
      - "@agentick/cli"
      - "@agentick/devtools"
      - "@agentick/guardrails"
      - "@agentick/client-multiplexer"
      - "@agentick/openai"
      - "@agentick/anthropic"
      - "@agentick/bedrock"
      - "@agentick/google"
      - "@agentick/ai-sdk"
      - "@agentick/apple"
      - "@agentick/connector"
      - "@agentick/connector-imessage"
      - "@agentick/connector-telegram"
      - "@agentick/huggingface"
      - "@agentick/sandbox-secure-exec"
      - "@agentick/scheduler"
      - "@agentick/secrets"
      - "@agentick/mcp"
      - "@agentick/eval"
    # v2 line (packages-next/*) — every publishable package; on the "next" lane.

