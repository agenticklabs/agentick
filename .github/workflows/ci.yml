name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22, 24]

    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm typecheck

      - name: Run tests
        run: pnpm test

      - name: Build
        run: pnpm build --filter '!agentick-website'

      # Empirical require(ESM) load gate — every publishable package's built
      # dist must load under CommonJS `require()` (Knowify's assistant-api load
      # path). A top-level await anywhere in a package's dist graph throws
      # ERR_REQUIRE_ASYNC_MODULE; this fails the build naming the offender.
      # Runs after Build (needs dist); the matrix covers Node 22 + 24.
      - name: No-TLA require(ESM) gate
        run: pnpm check:no-tla

  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4

      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint || true # TODO: Enable strict linting

